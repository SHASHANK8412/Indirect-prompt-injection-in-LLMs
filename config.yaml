# Experiment configuration. CLI flags override these values.

experiment:
  cv_dir: data/cvs
  attacked_dir: data/attacked
  results: results/raw.jsonl
  trials: 10
  temperature: 0.0          # the spec asks for 0; with 0, repeated trials are near-identical.
                            # Use e.g. 0.7 to mimic web-UI sampling as in the paper.
  seed: 1234                # per-trial seed = seed + trial
  placement: bottom         # top | middle | bottom | footer
  obfuscation: white        # visible | tiny | white
  input_format: extracted   # extracted (pdfplumber text of the PDF) | txt
  group_by: cell            # multi-doc sessions: cell (3 CVs) | seniority (9) | all (27)
  defenses: [none, ope]     # add spotlight, sanitize, prefilter for the extension study

metrics:
  asr_threshold: 1.0        # |dSI| needed in the attacker's direction to count as success
  baseline_defense: matched # baseline = clean CV under the same defense ("matched") or "none"

# Models. Prices are USD per 1M tokens and are APPROXIMATE - check the
# provider's current price list before trusting the cost estimate.
models:
  mock:
    provider: mock
    model: mock-1
    price_in: 0
    price_out: 0

  llama3:
    provider: ollama
    model: llama3.1:8b
    num_ctx: 16384          # Ollama defaults to a small context; senior multi-doc needs ~12k
    price_in: 0
    price_out: 0
  mistral:
    provider: ollama
    model: mistral:7b
    num_ctx: 16384
    price_in: 0
    price_out: 0
  qwen:
    provider: ollama
    model: qwen2.5:latest   # 7B; the one installed locally
    num_ctx: 16384
    price_in: 0
    price_out: 0

  gpt:
    provider: openai
    model: gpt-4o           # paper used ChatGPT-4; pick the model you want to test
    api_key_env: OPENAI_API_KEY
    rpm: 60
    price_in: 2.50
    price_out: 10.00
  gemini:
    provider: gemini
    model: gemini-2.5-flash
    api_key_env: GEMINI_API_KEY
    rpm: 30
    price_in: 0.30
    price_out: 2.50
  deepseek:
    provider: deepseek
    model: deepseek-chat    # DeepSeek V3
    api_key_env: DEEPSEEK_API_KEY
    rpm: 60
    price_in: 0.27
    price_out: 1.10
